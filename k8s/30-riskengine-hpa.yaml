apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: riskengine
  namespace: paypulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: riskengine
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30
